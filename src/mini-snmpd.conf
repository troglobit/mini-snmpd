# mini-snmpd.conf: Example

location       = "Exampleville Site 1."
contact        = "ops@example.com"
description    = "NAS monitor"

# Vendor OID tree
vendor         = ".1.3.6.1.4.1"

# true/false, or yes/no
authentication = true
community      = "public"

# MIB poll timeout, sec
timeout        = 1

# Disks to monitor, i.e. mount points in UCD-SNMP-MIB::dskTable
disk-table     = { "/", }

# Interfaces to monitor, currently only for IF-MIB::ifTable
#iface-table    = { "eth0", "eth1" }

# SNMPv2c trap sinks, addr[:port], default port 162, IPv6 as "[addr]:port"
#trap-table     = { "192.0.2.1", "[2001:db8::1]:1620" }

# Serve a fixed string on any OID, e.g. emulate an HP JetDirect print server
#custom ".1.3.6.1.4.1.11.2.3.9.1.1.7.0" {
#        value = "MFG:Hewlett-Packard;MDL:HP LaserJet 1020;CLS:PRINTER;"
#}

